<header class="cp-topbar"><a class="cp-brand" href="{{ url_for('dashboard') }}"><span class="cp-brand-icon"><i class="bi bi-shop-window"></i></span><span><small>PAINEL COOPEX</small><strong>COOPEX</strong></span></a><nav class="cp-mainnav" aria-label="Menu principal"><a class="cp-navlink {{ 'cp-active' if request.endpoint=='dashboard' else '' }}" href="{{ url_for('dashboard') }}"><i class="bi bi-speedometer2"></i> Resumo</a><div class="cp-dropdown"><button type="button" class="cp-navlink {{ 'cp-active' if request.endpoint=='listar_lancamentos' else '' }}" aria-expanded="false"><i class="bi bi-cash-coin"></i> Financeiro <i class="bi bi-chevron-down"></i></button><div class="cp-submenu"><a href="{{ url_for('listar_lancamentos') }}"><i class="bi bi-journal-text"></i> Lançamentos</a></div></div><div class="cp-dropdown"><button type="button" class="cp-navlink {{ 'cp-active' if request.endpoint in ('listar_cooperados','listar_estabelecimentos') else '' }}" aria-expanded="false"><i class="bi bi-people"></i> Cadastros <i class="bi bi-chevron-down"></i></button><div class="cp-submenu"><a href="{{ url_for('listar_cooperados') }}"><i class="bi bi-person-badge"></i> Cooperados</a><a href="{{ url_for('listar_estabelecimentos') }}"><i class="bi bi-shop-window"></i> Estabelecimentos</a></div></div></nav><a class="cp-exit" href="{{ url_for('logout') }}"><i class="bi bi-box-arrow-right"></i> Sair</a></header><script>document.querySelectorAll('.cp-dropdown>button').forEach(btn=>btn.addEventListener('click',()=>{const p=btn.parentElement;document.querySelectorAll('.cp-dropdown').forEach(d=>{if(d!==p){d.classList.remove('cp-open');d.querySelector('button').setAttribute('aria-expanded','false')}});const open=p.classList.toggle('cp-open');btn.setAttribute('aria-expanded',String(open))}));document.addEventListener('click',e=>{if(!e.target.closest('.cp-dropdown'))document.querySelectorAll('.cp-dropdown').forEach(d=>{d.classList.remove('cp-open');d.querySelector('button').setAttribute('aria-expanded','false')})});</script>
